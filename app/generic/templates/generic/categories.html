<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Categories - My Store</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f3f3f3;
    }

    header {
      background-color: #232f3e;
      color: white;
      padding: 1em;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 1.5em;
    }

    main {
      padding: 2em;
      max-width: 1200px;
      margin: auto;
    }

    /* Category List */
    #category-list {
      display: flex;
      gap: 1em;
      flex-wrap: wrap;
      margin-bottom: 2em;
    }

    .category-card {
      flex: 1 1 150px;
      background-color: white;
      border-radius: 5px;
      text-align: center;
      padding: 1em;
      cursor: pointer;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .category-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 10px rgba(0,0,0,0.2);
    }

    .category-card img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: 5px;
      margin-bottom: 0.5em;
    }

    /* Products Grid */
    #category-results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1.5em;
    }

    .product-card {
      background-color: white;
      border-radius: 5px;
      padding: 1em;
      text-align: center;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 10px rgba(0,0,0,0.2);
    }

    .product-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 5px;
      margin-bottom: 0.5em;
    }

    .product-card h3 {
      font-size: 1em;
      margin: 0.5em 0;
    }

    .product-card p {
      margin: 0.3em 0;
      color: #555;
    }

    footer {
      background-color: #232f3e;
      color: white;
      text-align: center;
      padding: 1em;
      margin-top: 2em;
    }
  </style>
</head>
<body>

<header>
  <h1>Amplify Categories</h1>
</header>

<main>
  <!-- Category List -->
  <section id="category-list">
    <div class="category-card">
      <img src="https://via.placeholder.com/150" alt="Genre">
      <h3>Genre</h3>
    </div>
    <div class="category-card">
      <img src="https://via.placeholder.com/150" alt="Artist">
      <h3>Artist</h3>
    </div>
    <div class="category-card">
      <img src="https://via.placeholder.com/150" alt="Condition">
      <h3>Condition</h3>
    </div>
    <!-- Add more categories here -->
  </section>

  <!-- Products Grid -->
  <section id="category-results">
    <div class="product-card">
      <img src="https://via.placeholder.com/150" alt="Product 1">
      <h3>Product 1</h3>
      <p>$29.99</p>
      <button>Add to Cart</button>
    </div>
    <div class="product-card">
      <img src="https://via.placeholder.com/150" alt="Product 2">
      <h3>Product 2</h3>
      <p>$49.99</p>
      <button>Add to Cart</button>
    </div>
    <div class="product-card">
      <img src="https://via.placeholder.com/150" alt="Product 3">
      <h3>Product 3</h3>
      <p>$19.99</p>
      <button>Add to Cart</button>
    </div>
    <!-- Add more product cards here -->
  </section>
</main>

<footer>
  &copy; 2026 Aplify Music Store
</footer>

</body>
</html>
