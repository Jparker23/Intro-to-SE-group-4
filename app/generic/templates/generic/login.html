{% extends "generic/base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<!--need to make this look better, possibly add a reset password page?-->
<form method="post" action="{% url 'login' %}">
  {% csrf_token %}
  
  
  <div class="login-container text-center">
    <h2 class="text-center mb-3">Welcome Back!</h2>
    
    <div class="form-group  mb-3">
      <label>Username</label>
      <input type="text" name="username" required>
    </div>
    
    <div class="form-group  mb-3">
      <label>Password</label>
      <input type="password" name="password" required>
    </div>
    
    {% if errors.login %}
    <div class="alert alert-danger">{{ errors.login }}</div>
    {% endif %}
    
    <button type="submit" href="{% url 'home' %}">Login</button>
    <a class="btn btn-primary mt-3" href="{% url 'register' %}">or register for an account!</a>
  </form>
</div>

{% endblock %}
