<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - My Store</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f3f3f3;
    }

    header {
      background-color: #232f3e;
      color: white;
      padding: 1em;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 1.5em;
    }

    main {
      display: flex;
      justify-content: center;
      padding: 2em;
      gap: 2em;
    }

    /* Cart Items */
    #cart-items {
      flex: 2;
      background-color: white;
      padding: 1em;
      border-radius: 5px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 1em;
      border-bottom: 1px solid #ddd;
      padding: 1em 0;
    }

    .cart-item img {
      width: 100px;
      height: 100px;
      object-fit: cover;
    }

    .cart-item-details {
      flex: 1;
    }

    .cart-item-details h3 {
      margin: 0;
      font-size: 1em;
    }

    .cart-item-details p {
      margin: 0.3em 0;
      color: #555;
    }

    .cart-item-actions {
      display: flex;
      flex-direction: column;
      gap: 0.5em;
    }

    .cart-item-actions input {
      width: 60px;
      padding: 0.3em;
    }

    .cart-item-actions button {
      background-color: #f0c14b;
      border: 1px solid #a88734;
      cursor: pointer;
      padding: 0.5em;
      border-radius: 3px;
    }

    /* Cart Summary */
    #cart-summary {
      flex: 1;
      background-color: white;
      padding: 1em;
      border-radius: 5px;
      height: fit-content;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }

    #cart-summary h2 {
      margin-top: 0;
    }

    #cart-summary p {
      font-size: 1em;
      margin: 0.5em 0;
    }

    #cart-summary button {
      width: 100%;
      background-color: #f0c14b;
      border: 1px solid #a88734;
      padding: 0.8em;
      font-size: 1em;
      cursor: pointer;
      border-radius: 3px;
      margin-top: 1em;
    }

    footer {
      background-color: #232f3e;
      color: white;
      text-align: center;
      padding: 1em;
      margin-top: 2em;
    }
  </style>
</head>
<body>

<header>
  <h1>Amplify Cart</h1>
</header>

<main>
  <!-- Cart Items -->
  <section id="cart-items">
    <h2>Your Shopping Cart</h2>

    <div class="cart-item">
      <img src="https://via.placeholder.com/100" alt="Item Image">
      <div class="cart-item-details">
        <h3>Item 1 Title</h3>
        <p>$29.99</p>
        <p>In stock</p>
      </div>
      <div class="cart-item-actions">
        <input type="number" value="1" min="1">
        <button>Remove</button>
      </div>
    </div>

    <div class="cart-item">
      <img src="https://via.placeholder.com/100" alt="Item Image">
      <div class="cart-item-details">
        <h3>Item 2 Title</h3>
        <p>$49.99</p>
        <p>In stock</p>
      </div>
      <div class="cart-item-actions">
        <input type="number" value="2" min="1">
        <button>Remove</button>
      </div>
    </div>

    <!-- Add more cart items here -->
  </section>

  <!-- Cart Summary -->
  <section id="cart-summary">
    <h2>Order Summary</h2>
    <p>Subtotal (3 items): <strong>$129.97</strong></p>
    <p>Estimated Tax: <strong>$10.40</strong></p>
    <button>Proceed to Checkout</button>
  </section>
</main>

<footer>
  &copy; 2026 Amplify Music Store
</footer>

</body>
</html>
