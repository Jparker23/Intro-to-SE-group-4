<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - My Store</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f3f3f3;
    }

    header {
      background-color: #232f3e;
      color: white;
      padding: 1em;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 1.5em;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 2em;
      display: grid;
      grid-template-columns: 2fr 1fr;
        gap: 2em;
    }

    /* Forms and Summary */
    section {
      background-color: white;
      padding: 1.5em;
      border-radius: 5px;
      margin-bottom: 1.5em;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 1em;
      font-size: 1.2em;
      color: #232f3e;
    }

    label {
      display: block;
      margin-top: 0.5em;
      margin-bottom: 0.2em;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 0.5em;
      margin-bottom: 0.8em;
      border: 1px solid #ccc;
      border-radius: 3px;
      box-sizing: border-box;
    }

    #order-summary {
      display: flex;
      flex-direction: column;
      gap: 0.5em;
    }

    #order-summary p {
      margin: 0.5em 0;
    }

    #order-summary .total {
      font-weight: bold;
      font-size: 1.1em;
    }

    #checkout-action button {
      width: 100%;
      background-color: #f0c14b;
      border: 1px solid #a88734;
      padding: 1em;
      font-size: 1em;
      cursor: pointer;
      border-radius: 3px;
      margin-top: 1em;
    }

    /* Layout adjustments for checkout form sections */
    #shipping-info, #payment-info {
      margin-bottom: 1.5em;
    }

    /* Stack sections for smaller screens */
    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>Checkout</h1>
</header>

<main>
  <!-- Left Column: Forms -->
  <div>
    <!-- Shipping Info -->
    <section id="shipping-info">
      <h2>Shipping Information</h2>
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="John Doe">

      <label for="address">Address</label>
      <input type="text" id="address" placeholder="123 Main St">

      <label for="city">City</label>
      <input type="text" id="city" placeholder="Anytown">

      <label for="state">State</label>
      <input type="text" id="state" placeholder="CA">

      <label for="zip">ZIP Code</label>
      <input type="text" id="zip" placeholder="12345">
    </section>

    <!-- Payment Info -->
    <section id="payment-info">
      <h2>Payment Information</h2>
      <label for="card-number">Card Number</label>
      <input type="text" id="card-number" placeholder="1234 5678 9012 3456">

      <label for="exp-date">Expiration Date</label>
      <input type="text" id="exp-date" placeholder="MM/YY">

      <label for="cvv">CVV</label>
      <input type="text" id="cvv" placeholder="123">
    </section>
  </div>

  <!-- Right Column: Order Summary -->
  <div>
    <section id="order-summary">
      <h2>Order Summary</h2>
      <p>Item 1 x 1 - $29.99</p>
      <p>Item 2 x 2 - $99.98</p>
      <p>Subtotal: $129.97</p>
      <p>Estimated Tax: $10.40</p>
      <p class="total">Total: $140.37</p>
      <section id="checkout-action">
        <button>Place Order</button>
      </section>
    </section>
  </div>
</main>

<footer>
  &copy; 2026 Amplify Music Store
</footer>

</body>
</html>
