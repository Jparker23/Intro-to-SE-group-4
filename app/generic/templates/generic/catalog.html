{% extends "generic/base.html" %}

{% block title %}Catalog{% endblock %}
<!--formatting is messed up on my product containers!! Really this is just a gimmic page, AJ may have already made a page thats similar to this, this is just a model so my home.html page can have something to route to-->
{% block content %}
<div class="container my-4">
    <div class="d-flex align-items-center justify-content-between mb-2">
        <h2 class="m-0">Catalog</h2>
        <a class="btn btn-outline-secondary" href="/api/compare/">Compare</a>
        </div
        >
        <p class= "mb-3">This will be the entire catalog and will have categories and the brands filters. </p>
        
        <!-- Has some filter logic -->
        <div class="card mb-4">
            <div class="card-body">
                <form class="row g-2" method="get" action="/api/catalog/">
                    <div class="col-12 col-md-3">
                        <input class="form-control" name="q" placeholder="Search" value= "{{ request.GET.q }}">
                    </div>
                    
                    <div class="col-6 col-md-2">
                        <select class="form-select" name="seller">
                            <option value="">Brand</option>
                            <option {% if request.GET.seller == "Seller1" %}selected{% endif %}>Seller1</option>
                            <option {% if request.GET.seller == "Seller2" %}selected{% endif %}>Seller2</option>
                            <option {% if request.GET.seller == "Seller3" %}selected{% endif %}>Seller3</option>
                            <option {% if request.GET.seller == "Seller4" %}selected{% endif %}>Seller4</option>
                        </select>
                    </div>
                    
                    <div class="col-6 col-md-2">
                        <select class="form-select" name="category">
                            <option value="">Category</option>
                            <option {% if request.GET.category == "Records" %}selected{% endif %}>Records</option>
                            <option {% if request.GET.category == "Record Players" %}selected{% endif %}>Record Players</option>
                            
                            <!-- these are addons that can be selected from the home page-->
                            <option {% if request.GET.category == "Amps" %}selected{% endif %}>Amps</option>
                            <option {% if request.GET.category == "Tuners" %}selected{% endif %}>Tuners</option>
                            <option {% if request.GET.category == "Headphones" %}selected{% endif %}>Headphones</option>
                            <option {% if request.GET.category == "CDs" %}selected{% endif %}>CDs</option>
                            <option {% if request.GET.category == "Cleaning Kits" %}selected{% endif %}>Cleaning Kits</option>
                        </select>
                    </div>
                    
                    <div class="col-6 col-md-2">
                         <input class="form-control" name="min_price" placeholder="Min $" type="number" step="0.01"
                 value="{{ request.GET.min_price }}">
                    </div>
                    
                    <div class="col-6 col-md-2">
                        <input class="form-control" name="max_price" placeholder="Max $" type="number" step="0.01"
                 value="{{ request.GET.max_price }}">
                    </div>
                    
                    <div class="col-12 col-md-1 d-grid">
                        <button class="btn btn-primary" type="submit">Apply</button>
                    </div>
                </form>
                
                <div class="mt-2">
                    <a class="small" href="/api/catalog/">Clear filters</a>
                </div>
            </div>
        </div>
        
        <!-- Results from filter (placeholders for now) -->
        <div class="row g-3">
            {% for i in range_8 %}
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card h-100 productCard">
                    <div class="photoPlaceholder">Photo</div>
                    <div class="card-body">
                        <h5 class="productName">Product Name</h5>
                        <div class="productPrice">$0.00</div>
                        <p class="productDesc">description</p>
                        
                        <!-- compare checkbox NOT DONE  -->
                        <div class="form-check mt-2">
                            <input class="form-check-input" type="checkbox">
                            <label class="form-check-label small">
                                Add to compare
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
    {% endblock %}
