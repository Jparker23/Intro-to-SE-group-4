<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Comparison - My Store</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f3f3f3;
    }

    header {
      background-color: #232f3e;
      color: white;
      padding: 1em;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 1.5em;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 2em;
    }

    /* Comparison Table */
    #comparison-table {
      overflow-x: auto;
      background-color: white;
      padding: 1em;
      border-radius: 5px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      margin-bottom: 2em;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 0.8em;
      text-align: center;
    }

    th {
      background-color: #f0f0f0;
      font-weight: bold;
    }

    td img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 5px;
    }

    /* Action Buttons */
    #comparison-actions {
      display: flex;
      gap: 1em;
      justify-content: center;
      flex-wrap: wrap;
    }

    #comparison-actions button {
      padding: 0.8em 1.5em;
      font-size: 1em;
      border-radius: 3px;
      border: 1px solid #a88734;
      background-color: #f0c14b;
      cursor: pointer;
      transition: background 0.2s;
    }

    #comparison-actions button:hover {
      background-color: #e2b33c;
    }

    footer {
      background-color: #232f3e;
      color: white;
      text-align: center;
      padding: 1em;
      margin-top: 2em;
    }

    /* Responsive */
    @media (max-width: 768px) {
      table, th, td {
        font-size: 0.9em;
      }
      td img {
        width: 80px;
        height: 80px;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>Compare Products</h1>
</header>

<main>
  <!-- Comparison Table -->
  <section id="comparison-table">
    <table>
      <tr>
        <th>Product</th>
        <td>
          <img src="https://via.placeholder.com/100" alt="Product 1">
          <p>Product 1</p>
        </td>
        <td>
          <img src="https://via.placeholder.com/100" alt="Product 2">
          <p>Product 2</p>
        </td>
      </tr>
      <tr>
        <th>Price</th>
        <td>$29.99</td>
        <td>$49.99</td>
      </tr>
      <tr>
        <th>Condition</th>
        <td>New</td>
        <td>Used - Like New</td>
      </tr>
      <tr>
        <th>Seller</th>
        <td>Seller A</td>
        <td>Seller B</td>
      </tr>
    </table>
  </section>

  <!-- Comparison Actions -->
  <section id="comparison-actions">
    <button>Remove Selected</button>
    <button>Add Selected to Cart</button>
  </section>
</main>

<footer>
  &copy; 2026 Amplify Music Store
</footer>

</body>
</html>
