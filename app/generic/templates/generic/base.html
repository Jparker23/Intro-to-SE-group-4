{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Amplify{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="{% url 'home' %}">Amplify</a>
    <div class="d-flex gap-3">
      <a class="text-white text-decoration-none small" href="{% url 'login_jwt' %}">Login</a>
      <a class="text-white text-decoration-none small" href="{% url 'register' %}">Register</a>
    </div>
  </nav>
  <div class="container py-5">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-danger">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
