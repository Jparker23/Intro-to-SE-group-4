<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search - My Store</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f3f3f3;
    }

    header {
      background-color: #232f3e;
      color: white;
      padding: 1em;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 1.5em;
    }

    main {
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 1.5em;
      max-width: 1200px;
      margin: auto;
      padding: 2em;
    }

    /* Search Bar */
    #search-bar {
      grid-column: span 2;
      display: flex;
      gap: 0.5em;
      margin-bottom: 1.5em;
    }

    #search-bar input[type="text"] {
      flex: 1;
      padding: 0.5em;
      font-size: 1em;
      border-radius: 3px;
      border: 1px solid #ccc;
    }

    #search-bar button {
      padding: 0.5em 1em;
      font-size: 1em;
      border-radius: 3px;
      border: 1px solid #a88734;
      background-color: #f0c14b;
      cursor: pointer;
    }

    #search-bar button:hover {
      background-color: #e2b33c;
    }

    /* Filters Sidebar */
    #filters {
      background-color: white;
      padding: 1em;
      border-radius: 5px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      gap: 1em;
    }

    #filters h3 {
      margin-top: 0;
    }

    #filters label {
      display: block;
      margin: 0.3em 0;
    }

    /* Search Results */
    #search-results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.5em;
    }

    .product-card {
      background-color: white;
      border-radius: 5px;
      padding: 1em;
      text-align: center;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 10px rgba(0,0,0,0.2);
    }

    .product-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 5px;
      margin-bottom: 0.5em;
    }

    .product-card h3 {
      font-size: 1em;
      margin: 0.5em 0;
    }

    .product-card p {
      margin: 0.3em 0;
      color: #555;
    }

    .product-card a {
      display: inline-block;
      margin-top: 0.5em;
      padding: 0.5em 1em;
      background-color: #f0c14b;
      border: 1px solid #a88734;
      border-radius: 3px;
      text-decoration: none;
      color: black;
    }

    .product-card a:hover {
      background-color: #e2b33c;
    }

    footer {
      grid-column: span 2;
      background-color: #232f3e;
      color: white;
      text-align: center;
      padding: 1em;
      margin-top: 2em;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }

      #search-bar {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>Search </h1>
</header>

<main>
  <!-- Search Bar -->
  <section id="search-bar">
    <input type="text" placeholder="Search for products...">
    <button>Search</button>
  </section>

  <!-- Filters Sidebar -->
  <section id="filters">
    <h3>Filter by Artist</h3>
    <label><input type="checkbox"> Artist 1</label>
    <label><input type="checkbox"> Artist 2</label>

    <h3>Filter by Genre</h3>
    <label><input type="checkbox"> Genre 1</label>
    <label><input type="checkbox"> Genre 2</label>

    <h3>Filter by Price</h3>
    <label><input type="checkbox"> Under $25</label>
    <label><input type="checkbox"> $25 - $50</label>
  </section>

  <!-- Search Results -->
  <section id="search-results">
    <div class="product-card">
      <img src="https://via.placeholder.com/150" alt="Product 1">
      <h3>Product 1</h3>
      <p>$29.99</p>
      <a href="product.html">View Product</a>
    </div>

    <div class="product-card">
      <img src="https://via.placeholder.com/150" alt="Product 2">
      <h3>Product 2</h3>
      <p>$49.99</p>
      <a href="product.html">View Product</a>
    </div>

    <div class="product-card">
      <img src="https://via.placeholder.com/150" alt="Product 3">
      <h3>Product 3</h3>
      <p>$19.99</p>
      <a href="product.html">View Product</a>
    </div>

    <!-- Add more product cards here -->
  </section>
</main>

<footer>
  &copy; 2026 Amplify Music Store
</footer>

</body>
</html>
