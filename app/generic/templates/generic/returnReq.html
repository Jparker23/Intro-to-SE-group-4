{% extends "generic/base.html" %}
{% block title %}Request Return{% endblock %}

{% block content %}
<div class="container my-4">
  <h2>Request a Return</h2>
  <p>Submit a return request for {{ order_item.product.name }}</p>

  <div class="card p-3 mb-3">
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="order_item_id" value="{{ order_item.id }}">

      <div class="mb-3">
        <label for="reason" class="form-label">Reason for return</label>
        <textarea name="reason" id="reason" class="form-control" rows="4" required></textarea>
      </div>

      <div class="d-flex gap-2">
        <a class="btn btn-outline-secondary" href="{% url 'orders' %}">Back to orders</a>
        <button type="submit" class="btn btn-primary">Submit</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
